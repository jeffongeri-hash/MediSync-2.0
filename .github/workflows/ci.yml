name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medisync
          POSTGRES_PASSWORD: medisync
          POSTGRES_DB: medisync
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medisync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway database; not a secret.
      DATABASE_URL: postgresql://medisync:medisync@localhost:5432/medisync
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test --reporter=dot
      - name: Ingest issue report
        run: pnpm -s ingest:report >> "$GITHUB_STEP_SUMMARY"
      - name: Mapping coverage report
        run: pnpm -s mapping:report >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer fidelity report (one synthetic patient, dry run)
        run: |
          pnpm -s transfer c4a5ef89-933c-c428-8fa7-4a26d9f621a9 --dry-run --at 2026-10-11T00:00:00Z --out exports
          cat exports/c4a5ef89-933c-c428-8fa7-4a26d9f621a9.fidelity.md >> "$GITHUB_STEP_SUMMARY"
      - name: Reconciliation eval (recorded Claude responses; unrecorded cases are reported, not passed)
        run: pnpm -s eval >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
